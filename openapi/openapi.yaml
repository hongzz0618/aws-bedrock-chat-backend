openapi: 3.1.0
info:
  title: AWS Bedrock Chat Backend API
  version: 0.2.0
  description: Authenticated serverless GenAI chat API reference.
servers:
  - url: https://example.execute-api.eu-west-1.amazonaws.com
    description: Placeholder deployed API URL
components:
  securitySchemes:
    CognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito User Pool JWT validated by API Gateway HTTP API JWT authorizer.
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: aws-bedrock-chat-backend
    ChatRequest:
      type: object
      description: temperature and top_p are mutually exclusive. Supply at most one.
      required: [prompt]
      additionalProperties: false
      not:
        required: [temperature, top_p]
      allOf:
        - not:
            required: [mode, system_prompt]
        - not:
            required: [mode, history_turns]
      properties:
        mode:
          type: string
          const: runbook
          description: Grounded Runbook guidance, available only when RAG_ENABLED is true (disabled by default; otherwise HTTP 400). system_prompt and history_turns must be omitted. Uses no history or tools. Server limits are 3 whole chunks, 3000 evidence-text characters and 12000 combined model-input characters including instructions and source labels (UTF-16 code units). Omit mode for regular chat.
        prompt:
          type: string
          description: Leading and trailing whitespace is trimmed before validation; the prompt must contain at least one non-whitespace character.
          minLength: 1
          maxLength: 8000
          pattern: '\S'
        session_id:
          type: string
          maxLength: 128
        system_prompt:
          type: string
          maxLength: 4000
        history_turns:
          type: integer
          minimum: 0
          maximum: 20
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
        temperature:
          type: number
          minimum: 0
          maximum: 1
        top_p:
          type: number
          minimum: 0
          maximum: 1
    Usage:
      type: object
      additionalProperties: true
      properties:
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
    RunbookSource:
      type: object
      required: [documentId, chunkId, title, section, version]
      additionalProperties: false
      properties:
        documentId:
          type: string
        chunkId:
          type: string
        title:
          type: string
        section:
          type: string
        version:
          type: string
    ChatSuccessResponse:
      type: object
      required: [session_id, timestamp, response, usage]
      additionalProperties: false
      properties:
        session_id:
          type: string
        timestamp:
          type: integer
        response:
          type: string
        usage:
          description: Token usage aggregated across model calls when Tool Calling is enabled. Empty object for a Runbook abstention without a model call.
          $ref: "#/components/schemas/Usage"
        stopReason:
          type: string
          description: Model stop reason when available; omitted for a Runbook abstention without a model call.
        sources:
          type: array
          maxItems: 3
          description: Present only for runbook responses. Metadata of actual reference excerpts supplied to the model, not proof that every sentence has been independently verified. Empty for a safe abstention when no qualifying whole excerpts fit the budgets. Successful answers and abstentions are saved to the authenticated user's session.
          items:
            $ref: "#/components/schemas/RunbookSource"
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
paths:
  /health:
    get:
      operationId: getHealth
      summary: Public health check
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          description: Request throttled by API Gateway
  /chat:
    post:
      operationId: postChat
      summary: Authenticated chat completion
      security:
        - CognitoJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSuccessResponse"
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Request throttled by API Gateway
        "500":
          description: Internal processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream model response failure or tool orchestration failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Temporary model throttling or availability failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
